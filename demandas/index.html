<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Demandas">
<meta name="theme-color" content="#CC092F"><meta name="author" content="José Samuel Silva">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<style>body{padding-top:env(safe-area-inset-top)}header,.ihero{padding-top:calc(18px + env(safe-area-inset-top))!important;margin-top:calc(-1 * env(safe-area-inset-top))}#frzb{padding-top:calc(7px + env(safe-area-inset-top))}</style>
<meta name="author" content="José Samuel Silva">
<title>Demandas</title>
<style>
:root{--red:#cc092f;--red-d:#a30725;--bg:#f5f5f7;--card:#fff;--card2:#f7f7f9;--text:#1d1d1f;--text2:#3a3a3c;--muted:#6e6e73;--line:#e5e5ea;--ok:#1f9d55;--inp:#fff;--late:#fff5f6;--ov:rgba(0,0,0,.4)}
[data-theme=dark]{--bg:#0e0e10;--card:#1c1c1e;--card2:#26262a;--text:#f2f2f7;--text2:#d1d1d6;--muted:#9a9aa1;--line:#2e2e32;--inp:#2a2a2e;--late:#2b1317;--ov:rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text);padding-bottom:150px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;color:inherit}
header{background:var(--red);color:#fff;padding:16px 16px 14px}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
header h1{font-size:20px;font-weight:700}
header p{font-size:13px;opacity:.85;margin-top:2px}
.hbtn{background:rgba(255,255,255,.18);border:none;color:#fff;width:36px;height:36px;border-radius:10px;font-size:18px;cursor:pointer}
.prog{margin-top:12px;background:rgba(255,255,255,.25);border-radius:99px;height:7px;overflow:hidden}
.prog div{height:100%;background:#fff;transition:width .3s}
.progtxt{font-size:12px;margin-top:6px;opacity:.9}
nav{display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);position:fixed;left:0;right:0;bottom:0;z-index:6;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:none;padding:6px 2px 4px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--red)}nav button.on svg{stroke-width:2.2}
nav button.on .nvi{background:rgba(204,9,47,.12)}.nvi{padding:3px 16px;border-radius:99px;display:grid;place-content:center;transition:background .2s}
main{max-width:720px;margin:0 auto;padding:12px}
.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--inp);font-size:16px;margin-bottom:10px}
.filters{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;align-items:center}
.tab{border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:99px;font-size:13px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.fsel{border:1px solid var(--line);background:var(--card);padding:7px 8px;border-radius:99px;font-size:13px;max-width:150px}
section{background:var(--card);border-radius:14px;margin-bottom:12px;overflow:hidden;border:1px solid var(--line)}
section>h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:12px 14px 8px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.item.late{background:var(--late)}
.ck{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:2px solid #b8b8bf;border-radius:7px;flex-shrink:0;margin-top:1px;cursor:pointer;display:grid;place-content:center;background:var(--inp)}
.ck:checked{background:var(--ok);border-color:var(--ok)}
.ck:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.body{flex:1;min-width:0;cursor:pointer}
.who{font-weight:600;font-size:15px}
.emp{font-weight:400;color:var(--muted);font-size:13px}
.what{font-size:14px;color:var(--text2);margin-top:2px;line-height:1.35;white-space:pre-line}
.lastlog{font-size:12px;color:var(--muted);margin-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:12px;border:1px solid var(--line);background:var(--card2);border-radius:6px;padding:3px 7px;color:var(--text2);cursor:pointer}
.chip.bad{border-color:#f3b4bf;color:#d1243f}
.tag{display:inline-block;font-size:11px;padding:3px 7px;border-radius:5px;font-weight:600}
.tg-hoje{background:rgba(204,9,47,.12);color:#d1243f}
.tg-late,.tg-urg{background:#cc092f;color:#fff}
.tg-amanha{background:rgba(217,142,4,.16);color:#b7791f}
.tg-date{background:rgba(84,104,212,.15);color:#5d6fd8}
.tg-ok{background:rgba(31,157,85,.16);color:#1f9d55}
.tg-no,.tg-cart{background:rgba(120,120,128,.18);color:var(--muted)}
.done .who,.done .what{text-decoration:line-through;color:var(--muted)}
.side{display:flex;flex-direction:column;gap:6px;align-items:center}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-content:center;font-size:15px;cursor:pointer}
.empty{padding:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.fab{position:fixed;right:16px;bottom:84px;background:var(--red);color:#fff;border:none;border-radius:99px;padding:14px 20px;font-size:15px;font-weight:700;box-shadow:0 6px 18px rgba(204,9,47,.35);cursor:pointer;z-index:5}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pc{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);position:relative;background:var(--card);transition:transform .18s ease;touch-action:pan-y}
.pc.done{opacity:.6}.pc.done .pn{text-decoration:line-through}
.pav{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-content:center;font-size:17px}
.pb{flex:1;min-width:0;cursor:pointer}.pn{font-weight:600;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pv{font-size:12.5px;margin-top:2px;font-weight:600;line-height:1.3}
.pm{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.pm .tag,.pm .chip{font-size:11px;padding:2px 6px}
.po{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swbg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:13px;font-weight:700;color:#fff;pointer-events:none}
.swrap{position:relative;overflow:hidden}
.gcp{font-size:11px;text-transform:none;letter-spacing:0;color:var(--red);background:none;border:none;font-weight:700;cursor:pointer}
.ghead{background:linear-gradient(135deg,var(--red),#8f0620);color:#fff;border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 8px 24px rgba(204,9,47,.22)}
.ghead .gt{font-size:18px;font-weight:700;line-height:1.2}.ghead .gs{font-size:12.5px;opacity:.85;margin-top:2px}
.gchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.gchip{background:rgba(255,255,255,.16);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600}
.gbar{height:6px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:12px}.gbar div{height:100%;background:#fff}
.gtop{display:flex;align-items:center;gap:8px;margin-bottom:10px}.gtop .sp{flex:1}
#frz{position:fixed;inset:0;z-index:55;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;background:radial-gradient(120% 60% at 50% 0%,#1d3557 0%,#0b1220 55%,#05070c 100%);color:#fff}
.fzb{width:100%;max-width:440px;padding:40px 24px 30px;text-align:center}.fzt{font-size:56px;font-weight:200;letter-spacing:1px}.fzd{font-size:14px;opacity:.7}
.fzi{font-size:40px;margin:22px 0 6px}#frz h2{font-size:24px;font-weight:600}#frz p{opacity:.75;font-size:14px;margin-top:4px}
.fzg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.fzg div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 6px}.fzg b{display:block;font-size:22px}.fzg span{font-size:11px;opacity:.7}
.fzl{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:4px 14px;text-align:left}.fzr{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.08);font-size:14px}.fzr:first-child{border-top:0}.fzr span{opacity:.65}.fzr b{text-align:right}
.fzh{text-align:left;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.7;margin:18px 2px 8px}
.fzlist{text-align:left;max-height:34vh;overflow-y:auto;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:6px 14px}.fzit{padding:8px 0;border-top:1px solid rgba(255,255,255,.08);font-size:14px}.fzit:first-child{border-top:0}.fzit small{opacity:.65}
.fzbtn{margin-top:22px;width:100%;padding:15px;border-radius:30px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;font-size:15px;font-weight:600}.fzs{font-size:11px;opacity:.5;margin-top:8px}
#frzb{position:fixed;top:0;left:0;right:0;z-index:30;display:none;background:#f59e0b;color:#1a1a1a;font-size:12.5px;font-weight:700;text-align:center;padding:7px 10px}body.hasfrzb{padding-top:30px}
.ihero{background:linear-gradient(160deg,#d10a33,#8f0620);padding:18px 16px 56px;border-radius:0 0 26px 26px}.ihero h1{font-size:22px}
.isearch{width:100%;margin-top:14px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 14px;font-size:15px;color:#fff}.isearch::placeholder{color:rgba(255,255,255,.75)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:-52px 0 12px;position:relative}
.k{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 8px 20px rgba(0,0,0,.18);text-align:left;cursor:pointer;color:var(--text)}.k b{font-size:24px;display:block}.k span{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.25;display:block}
.isec{border-radius:16px}.isec>h2{align-items:center}
.ir{display:flex;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}.isec>h2+.ir,.isub+.ir{border-top:0}
.iic{width:36px;height:36px;border-radius:50%;display:grid;place-content:center;font-size:16px;flex:none;font-weight:700}
.itx{flex:1;min-width:0}.itx b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.itx small{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.isub{font-size:11px;font-weight:700;color:var(--muted);padding:8px 14px 2px;text-transform:uppercase;letter-spacing:.04em}
.ibtn{display:block;width:calc(100% - 28px);margin:6px 14px 12px;background:rgba(204,9,47,.12);color:var(--red);border:none;border-radius:12px;padding:11px;font-size:13px;font-weight:700;cursor:pointer}
.ivtop{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.ivst{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;cursor:pointer}
.ivx{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--card2);border:none;color:var(--muted);font-size:15px;cursor:pointer}
.ivwhat{font-size:18px;font-weight:700;line-height:1.3;margin:12px 0 8px;white-space:pre-line}
.ivcard{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:12px}
.ivcli{display:flex;gap:12px;align-items:center}.ivcli b{font-size:15px;display:block}.ivcli small{display:block;color:var(--muted);font-size:12.5px}
.ivav{width:42px;height:42px;border-radius:50%;background:rgba(204,9,47,.18);color:var(--red);display:grid;place-content:center;font-weight:700;flex:none}
.ivlink{color:var(--red);font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}
.ivqa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.ivqa button{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 4px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer}.ivqa i{display:block;font-style:normal;font-size:20px;margin-bottom:3px}
.ivh{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:16px 2px 8px;display:flex;justify-content:space-between}
.ivbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:6px}.ivbar div{height:100%;background:#16a34a}
.ivck{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:14px;cursor:pointer}
.ivlog{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}.ivlog:first-child{border-top:0}.ivlog small{color:var(--muted);min-width:72px;font-size:11.5px;line-height:1.35}
.blk{border:1px solid var(--line);border-radius:14px;padding:0 12px 6px;margin-bottom:10px;background:var(--card)}
.blk>summary{list-style:none;font-weight:700;font-size:14px;padding:12px 0;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.blk>summary::-webkit-details-marker{display:none}.blk>summary::after{content:'›';font-size:20px;color:var(--muted);transform:rotate(90deg);transition:transform .2s}
.blk:not([open])>summary::after{transform:rotate(0)}
.btn{background:var(--red);color:#fff;border:none;padding:10px 14px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;text-align:center;display:inline-block}
.btn.sec{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.dang{background:var(--card);color:#d1243f;border:1px solid #f3b4bf}
.btn.sm{padding:7px 10px;font-size:13px}
.btn[disabled]{opacity:.5}
.av{width:38px;height:38px;border-radius:50%;background:rgba(204,9,47,.12);color:#d1243f;display:grid;place-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-size:26px}
.stat span{font-size:12px;color:var(--muted)}
.stat.red b{color:#d1243f}
.bar{padding:9px 14px;border-top:1px solid var(--line);font-size:13px}
.bar .bl{display:flex;justify-content:space-between;margin-bottom:5px}
.bar .bt{height:7px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar .bt div{height:100%;border-radius:99px}
.hline{padding:9px 14px;border-top:1px solid var(--line);font-size:14px}
.hline small{color:var(--muted)}
.trow{display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.trow .tx{flex:1;min-width:0}
.trow small{color:var(--muted);display:block}
#ov{position:fixed;inset:0;background:var(--ov);display:none;align-items:flex-end;justify-content:center;z-index:10}
#ov.open{display:flex}
select{pointer-events:none;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px!important}
#pk{position:fixed;inset:0;background:var(--ov);display:none;align-items:flex-end;justify-content:center;z-index:60}
#pk.open{display:flex}
.pkbox{background:var(--card);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:6px 0 18px;max-height:78vh;overflow-y:auto;animation:pkup .18s ease-out;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
@keyframes pkup{from{transform:translateY(60px);opacity:.3}to{transform:none;opacity:1}}
.pkgrab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:6px auto 12px}
.pkt{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:0 22px 6px}
.pko{display:flex;align-items:center;gap:14px;padding:15px 22px;font-size:16px;cursor:pointer;border-top:1px solid var(--line)}
.pko:first-of-type{border-top:0}.pko:active{background:var(--card2)}
.pko .dot{width:12px;height:12px;border-radius:50%;flex:none}
.pko.on{font-weight:700;background:var(--card2)}.pko .okm{margin-left:auto;color:var(--red);font-weight:800;font-size:18px}
.qs{border:0!important;font-weight:700!important}
.ucards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 12px}
.uteam{grid-column:1/-1;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:6px}
.ucard{display:flex;align-items:center;gap:10px;padding:10px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;text-align:left}
.ucard.on{border-color:var(--red);background:var(--card2);box-shadow:0 0 0 3px rgba(204,9,47,.15)}
.uav{width:36px;height:36px;border-radius:50%;display:grid;place-content:center;color:#fff;font-weight:700;font-size:16px;flex:none}
.ucard b{display:block;font-size:14px}.ucard small{display:block;font-size:11px;color:var(--muted)}
.cchips{display:flex;flex-wrap:wrap;gap:6px}
.cchip{padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-size:14px;cursor:pointer}
.cchip.on{border-color:var(--red);background:var(--red);color:#fff;font-weight:600}
.sheet{background:var(--card);width:100%;max-width:600px;border-radius:18px 18px 0 0;padding:18px 16px 24px;max-height:92vh;overflow-y:auto}
.sheet h3{font-size:17px;margin-bottom:12px}
.sheet h4{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 8px}
.fld{margin-bottom:10px;position:relative}
.fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--inp)}
.fld textarea{min-height:64px;resize:vertical}
.row2{display:flex;gap:8px}.row2>.fld{flex:1;min-width:0}
.hint{font-size:12px;margin-top:4px;color:var(--muted)}
.hint.ok{color:var(--ok)}.hint.bad{color:#d1243f}
.sbtns{display:flex;gap:8px;margin-top:16px}
.sbtns .btn{flex:1}
.sug{position:absolute;left:0;right:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;z-index:3;box-shadow:0 8px 20px rgba(0,0,0,.15);overflow:hidden}
.sug div{padding:10px 12px;border-top:1px solid var(--line);cursor:pointer;font-size:14px}
.sug div:first-child{border-top:0}
.sug small{color:var(--muted)}
.doc{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.doc span{flex:1}
.doc.okd span{text-decoration:line-through;color:var(--muted)}
.x{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0 4px}
.addrow{display:flex;gap:6px;margin-top:8px}
.addrow input{flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--inp)}
.log{padding:7px 0;border-top:1px solid var(--line);font-size:14px;display:flex;gap:8px}
.log small{color:var(--muted);white-space:nowrap}
.log span{flex:1}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.toggle small{display:block;color:var(--muted);font-size:12px}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:#b8b8bf;position:relative;cursor:pointer;flex-shrink:0;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.fld .sw{width:46px;height:28px;padding:0;border:0;border-radius:99px;background:#b8b8bf}.fld .sw:checked{background:var(--ok)}
.sw:checked{background:var(--ok)}.sw:checked::after{left:21px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:9px;border:none;background:var(--card);font-size:14px;cursor:pointer}
.seg button.on{background:var(--text);color:var(--bg)}
.rf{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5;margin-top:6px;background:var(--card2)}
.rf b{font-size:14px}
#toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:92vw;display:flex;gap:12px;align-items:center;white-space:nowrap}
#toast.show{opacity:1}
#toast button{background:none;border:none;color:#ff8fa3;font-weight:700;font-size:13px;pointer-events:auto}
#login{position:fixed;inset:0;background:var(--red);z-index:30;display:none;align-items:center;justify-content:center;padding:20px}
.lbox{background:var(--card);border-radius:20px;padding:26px 20px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.lbox h1{text-align:center;font-size:22px}.lbox>p{text-align:center;color:var(--muted);font-size:13px;margin-bottom:18px}
.llogo{width:56px;height:56px;border-radius:16px;background:var(--red);color:#fff;display:grid;place-content:center;font-size:30px;font-weight:700;margin:0 auto 10px}
.byl{font-size:11px;color:var(--muted);margin-top:5px}
#out{width:100%;height:220px;font-size:13px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--inp)}
</style>

<script src="webn.js"></script>

<script src="fb/firebase-auth-compat.js"></script>

<div id="root"></div>
<button class="fab" id="fab" data-act="fab">+ Nova demanda</button>
<div id="toast"></div>
<div id="ov"></div>
<script>
(function(){
'use strict';
var KEY='demandas_sam_v2';
var ANDROID=!!window.Android,N=window.Android||window.WEBN||null;
var VERSION='3.8';
var SEED={"v": 3, "updated": 0, "settings": {"theme": "auto"}, "clients": [], "items": [], "grupos": [], "history": [], "trash": [], "seedFolha": 1};
var TIPOS=['Abertura PJ','Consórcio','Contemplação','Crédito/Desconto','Cartões/Limite','Estorno','Procuração','Folha/Conta salário','Cielo','Pronampe','Outros'];
var TCOR={'Abertura PJ':'#2563eb','Consórcio':'#7c3aed','Contemplação':'#a21caf','Crédito/Desconto':'#0891b2','Cartões/Limite':'#db2777','Estorno':'#ea580c','Procuração':'#4f46e5','Folha/Conta salário':'#16a34a','Cielo':'#0284c7','Pronampe':'#059669','Outros':'#6b7280'};
var DOCS={
 'Abertura PJ':['Cartão CNPJ','Contrato social e última alteração','RG/CNH dos sócios administradores','Comprovante de endereço dos sócios','Comprovante de endereço da empresa','Relação de faturamento (12 meses)'],
 'Contemplação':['CRLV-e / Renavam','Dados do vendedor','Pedido de compra','Vistoria aprovada','Autorização de faturamento','DUT/ATPV com firma reconhecida','Contrato de alienação com firma reconhecida'],
 'Procuração':['Contrato social / última alteração','Documento do outorgante','Documento do outorgado','Comprovante de endereço do outorgado','Procuração assinada (firma ou ITI)'],
 'Folha/Conta salário':['Convênio de folha assinado','Lista de funcionários','Documentos dos funcionários','Arquivo CNAB240'],
 'Cartões/Limite':['Proposta assinada pelo cliente','Liberação da chefia','Aceite no app'],
 'Estorno':['Solicitação registrada','Retorno da análise'],
 'Cielo':['Horário agendado com o cliente','Credenciamento dos funcionários','Abertura de conta'],
 'Crédito/Desconto':['Boletos/títulos incluídos','Análise de limite','Liberação'],
 'Pronampe':['Solicitação enviada ao departamento','Retorno do departamento','Contratos enviados ao cliente']
};
var SECS=[['fazer','Para fazer'],['aguardando','Aguardando retorno'],['concluido','Concluído']];
var STATUS={ok:['Deferido','tg-ok'],no:['Indeferido','tg-no']};
var CARTEIRAS=['Micaele','Fernando'];
var KNOWN={};
var ITEM_TIPO={o1:'Cartões/Limite',o2:'Cartões/Limite',o3:'Cielo',o4:'Crédito/Desconto',o5:'Procuração',o6:'Consórcio',o7:'Contemplação',o8:'Abertura PJ',o9:'Abertura PJ',o10:'Consórcio',o11:'Estorno',o12:'Estorno'};

/* ---------- utilidades ---------- */
function $(s){return document.querySelector(s)}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return iso(new Date())}
function plus(n){var d=new Date();d.setDate(d.getDate()+n);return iso(d)}
function br(s){var p=s.split('-');return p[2]+'/'+p[1]}
function dt(ms){var d=new Date(ms);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim()}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function digits(v){return String(v||'').replace(/\D/g,'')}
function initials(n){var p=String(n||'?').trim().split(/\s+/);return ((p[0]||'?')[0]+(p[1]?p[1][0]:'')).toUpperCase()}
function title(s){return String(s||'').toLowerCase().replace(/(^|\s)(\S)/g,function(m,a,b){return a+b.toUpperCase()}).replace(/\b(De|Da|Do|Dos|Das|E|Me|Ltda|S\/a)\b/g,function(w){return w==='Me'||w==='Ltda'?w.toUpperCase():w.toLowerCase()})}
var tt;function toast(m,act){var t=$('#toast');t.innerHTML=esc(m)+(act?'<button id="tact">'+esc(act.label)+'</button>':'');t.classList.add('show');
  if(act)$('#tact').onclick=function(){act.fn();t.classList.remove('show')};clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},act?5000:2000)}
function cClean(v){return String(v||'').toUpperCase().replace(/[^0-9A-Z]/g,'').slice(0,14)}
function cFmt(v){var c=cClean(v),o='';for(var i=0;i<c.length;i++){if(i===2||i===5)o+='.';if(i===8)o+='/';if(i===12)o+='-';o+=c[i]}return o}
function cValid(v){var c=cClean(v);if(!/^[0-9A-Z]{12}[0-9]{2}$/.test(c))return false;if(/^(\d)\1{13}$/.test(c))return false;
  function calc(n){var s=0,w=n-7;for(var i=0;i<n;i++){s+=(c.charCodeAt(i)-48)*w;w=w===2?9:w-1}var r=s%11;return r<2?0:11-r}
  return calc(12)===+c[12]&&calc(13)===+c[13]}
function waNum(tel){var d=digits(tel);if(d.length===10||d.length===11)d='55'+d;return d.length>=12?d:''}
function telFmt(v){var d=digits(v);if(d.length===11)return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);if(d.length===10)return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6);return v||''}
function greet(){var h=new Date().getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'}
function lower1(s){s=String(s||'').trim().replace(/[.!]+$/,'');if(/^[A-ZÀ-Ú]{2}/.test(s))return s;return s.charAt(0).toLowerCase()+s.slice(1)}
function joinPt(a){return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' e '+a[a.length-1]}

/* ---------- dados ---------- */
function blankClient(nome){return {id:uid('c'),nome:nome||'',empresa:'',razao:'',fantasia:'',situacao:'',cidade:'',cnpj:'',conta:'',tel:'',carteira:'',obs:''}}
function guessTipo(t){t=norm(t);
  if(/pronampe/.test(t))return 'Pronampe';
  if(/contempla/.test(t))return 'Contemplação';if(/consorcio|lance|assembleia/.test(t))return 'Consórcio';
  if(/estorno/.test(t))return 'Estorno';if(/procura/.test(t))return 'Procuração';if(/cielo|credenciamento/.test(t))return 'Cielo';
  if(/cart(ao|oes)|majora|limite/.test(t))return 'Cartões/Limite';if(/folha|salario|cnab/.test(t))return 'Folha/Conta salário';
  if(/boleto|antecipa|desconto|credito/.test(t))return 'Crédito/Desconto';if(/abertura|documenta|tradu/.test(t))return 'Abertura PJ';return 'Outros'}
function fill(st){st.v=3;st.settings=st.settings||{};if(!st.settings.theme)st.settings.theme='auto';
  ['clients','items','history','trash','grupos','agman','msgr'].forEach(function(k){if(!Array.isArray(st[k]))st[k]=[]});
  if(st.settings&&st.settings.agMan){Object.keys(st.settings.agMan).forEach(function(k){if(!st.agman.some(function(x){return x.id===k}))st.agman.push(Object.assign({id:k},st.settings.agMan[k]))});delete st.settings.agMan}
  st.items.forEach(function(i){if(i.tipo==='Outros'&&/pronampe/i.test(i.what||''))i.tipo='Pronampe';if(i.tipo!=='Estorno'&&i.status&&!i.done)i.status='';i.docs=i.docs||[];i.log=i.log||[];i.tipo=i.tipo||'Outros';i.hora=i.hora||'';i.prio=i.prio||'';i.created=i.created||Date.now()});
  seedFolha(st);st.grupos.forEach(migFolha);
  return st}
function migrate(st){
  if(!st)return null;if(st.v===3)return fill(st);
  var now=Date.now(),out={v:3,updated:st.updated||now,settings:{theme:'auto'},clients:[],items:[],history:[],trash:[]},by={};
  function cli(who,it){var base=String(who||'Sem nome').replace(/\s*\(.*\)\s*$/,'').trim()||'Sem nome';
    var emp=(String(who||'').match(/\(([^)]*)\)/)||[])[1]||'';if(/cons[óo]rcio|cielo/i.test(emp))emp='';
    var k=norm(base),c=by[k];if(!c){c=blankClient(base);by[k]=c;out.clients.push(c)}
    var K=KNOWN[k];if(K)for(var f in K)if(!c[f])c[f]=K[f];
    if(emp&&!c.empresa)c.empresa=emp;
    if(it){if(it.cnpj&&!c.cnpj)c.cnpj=it.cnpj;if(it.conta&&!c.conta)c.conta=it.conta;if(it.tel&&!c.tel)c.tel=it.tel}
    return c}
  (st.items||[]).forEach(function(it){var c=cli(it.who,it);
    out.items.push({id:it.id||uid('i'),cid:c.id,s:it.s||'fazer',what:it.what||'',tipo:ITEM_TIPO[it.id]||guessTipo((it.who||'')+' '+(it.what||'')),due:it.due||'',hora:'',prio:'',status:it.status||'',docs:[],log:[],done:!!it.done,doneAt:it.done?(st.updated||now):0,created:now})});
  (st.history||[]).forEach(function(d){out.history.push({date:d.date,items:(d.items||[]).map(function(i){return {what:i.what,who:i.who,tipo:guessTipo((i.who||'')+' '+(i.what||'')),status:i.status||'',doneAt:Date.parse(d.date+'T18:00:00')}})})});
  return fill(out)}

var state=null;
try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
state=migrate(state)||migrate(SEED);
(function purge(){var lim=Date.now()-30*864e5;state.trash=state.trash.filter(function(t){return t.at>lim})})();

function getC(id){for(var i=0;i<state.clients.length;i++)if(state.clients[i].id===id)return state.clients[i];return null}
function cliName(id){var c=getC(id);return c?c.nome:'(sem cliente)'}
function cliLabel(id){var c=getC(id);return c?c.nome+(c.empresa?' ('+c.empresa+')':''):'(sem cliente)'}
function findItem(id){for(var i=0;i<state.items.length;i++)if(state.items[i].id===id)return state.items[i];return null}
function isLate(i){return !i.done&&i.due&&i.due<today()}
function lastAct(i){var l=i.log&&i.log.length?i.log[i.log.length-1].at:0;return Math.max(i.created||0,l)}

function saveOnly(){state.updated=Date.now();var j=JSON.stringify(state);try{localStorage.setItem(cloud.on?KEY+'_'+cloud.user:KEY,j)}catch(e){}if(cloud.on)syncUp();try{N&&N.saveState(j)}catch(e){}}
function commit(msg,act){saveOnly();render();if(msg)toast(msg,act)}

/* ---------- tema ---------- */
function applyTheme(){var t=state.settings.theme,dark=t==='dark';
  if(t==='auto'){try{dark=N&&N.isDark?N.isDark():matchMedia('(prefers-color-scheme: dark)').matches}catch(e){}}
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');try{N&&N.setDark&&N.setDark(dark)}catch(e){}}

/* ---------- interface ---------- */
var view='inicio',filtro='todas',ftipo='',fcart='',q='',qc='',armed={},ed=null;

function tag(t,c){return '<span class="tag '+c+'">'+esc(t)+'</span>'}
function ttag(t){var c=TCOR[t]||'#6b7280';return '<span class="tag" style="background:'+c+'22;color:'+c+'">'+esc(t)+'</span>'}
function dueTag(it){if(!it.due||it.done)return '';var t=today(),pre=it.s==='aguardando'?'Cobrar ':'',hr=it.hora?' '+it.hora:'';
  if(it.due<t)return tag('Atrasado · '+br(it.due)+hr,'tg-late');if(it.due===t)return tag(pre+'hoje'+hr,'tg-hoje');
  if(it.due===plus(1))return tag(pre+'amanhã'+hr,'tg-amanha');return tag(pre+br(it.due)+hr,'tg-date')}

function render(){
  applyTheme();
  var act=state.items,tot=act.length,ok=act.filter(function(i){return i.done}).length,p=tot?Math.round(ok/tot*100):0;
  var d=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
  var hh=new Date().getHours(),sau=(hh<12?'Bom dia':hh<18?'Boa tarde':'Boa noite')+(cloud.on&&me()?', '+me():'');
  var h=view==='inicio'?'<header class="ihero"><div class="hrow"><div><h1>'+esc(sau)+'</h1><p>'+esc(d.charAt(0).toUpperCase()+d.slice(1))+' · Agência 2947</p>'+(function(){var J=expJanela();return J.cong?'':'<p style="margin-top:3px">🕖 Aberto desde '+hm(J.abriu)+' · há '+dur(J.now-J.abriu)+' · congela às '+pad(EXP_FIM)+':00</p>'})()+(cloud.on?'<p style="margin-top:3px"><span id="sync"></span></p>':'')+'</div><button class="hbtn" data-act="settings" aria-label="Ajustes">⚙</button></div><input class="isearch" id="qi" type="search" placeholder="🔎 Buscar em tudo: cliente, CNPJ, funcionário, CPF…" value="'+esc(qi)+'"></header>':'<header><div class="hrow"><div><h1>Demandas do dia</h1><p>Agência 2947 · '+esc(d)+'</p>'+(cloud.on?'<p style="margin-top:3px">👤 '+esc(me())+' · '+esc(EQNOME[cloud.eq])+' · <span id="sync"></span></p>':'')+'</div><button class="hbtn" data-act="settings" aria-label="Ajustes">⚙</button></div>'+
    '<div class="prog"><div style="width:'+p+'%"></div></div><div class="progtxt">'+ok+' de '+tot+' concluídas · '+p+'%</div></header>';
  if(view==='inicio')h=h.replace(/<div class="prog">[\s\S]*<\/header>$/,'</header>');
  var NI={inicio:'<path d="M3.5 11.5L12 4l8.5 7.5"/><path d="M6 10v9.5h4.5V15h3v4.5H18V10"/>',demandas:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/>',clientes:'<circle cx="9" cy="8" r="3.2"/><path d="M3 19c.8-3.2 3.2-5 6-5s5.2 1.8 6 5"/><path d="M16 5.3a3 3 0 010 5.6M18 14.4c1.6.7 2.6 2.2 3 4.6"/>',
    listas:'<rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 3.5h6v3H9zM8.5 11h7M8.5 15h5"/>',resumo:'<path d="M5 20v-7M11 20V5M17 20V10M3 20h18"/>',historico:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'};
  var NAV='<nav>'+[['inicio','Início'],['demandas','Demandas'],['clientes','Clientes'],['listas','Listas'],['historico','Histórico']].map(function(t){
    return '<button data-act="view" data-v="'+t[0]+'" class="'+(view===t[0]||(t[0]==='inicio'&&view==='resumo')?'on':'')+'"><span class="nvi"><svg viewBox="0 0 24 24">'+NI[t[0]]+'</svg></span>'+t[1]+'</button>'}).join('')+'</nav>';
  h+='<main>';
  if(view==='inicio'){h+=renderInicio()}
  else if(view==='demandas'){
    h+=(filtro==='atrasadas'||filtro==='hoje'||filtro==='semret'?'<div class="rf" style="display:flex;align-items:center;margin-bottom:10px"><b style="flex:1">Filtro: '+{atrasadas:'Atrasadas',hoje:'Para hoje',semret:'Sem retorno há mais de 3 dias'}[filtro]+'</b><button class="btn sec sm" data-act="filtro" data-v="todas">✕ Limpar</button></div>':'')+'<input class="search" id="q" type="search" placeholder="Buscar cliente, empresa, CNPJ ou demanda" value="'+esc(q)+'">';
    h+='<div class="filters">'+[['todas','Todas'],['pendentes','Pendentes'],['feitas','Feitas']].map(function(t){
      return '<button class="tab'+(filtro===t[0]?' on':'')+'" data-act="filtro" data-v="'+t[0]+'">'+t[1]+'</button>'}).join('')+
      '<select class="fsel" id="ftipo"><option value="">Todos os tipos</option>'+TIPOS.map(function(t){return '<option'+(ftipo===t?' selected':'')+'>'+esc(t)+'</option>'}).join('')+'</select>'+
      '<select class="fsel" id="fcart"><option value="">Todas as carteiras</option>'+carteiras().map(function(t){return '<option'+(fcart===t?' selected':'')+'>'+esc(t)+'</option>'}).join('')+'</select></div>';
    h+='<div id="list"></div>';
    h+='<div class="actions"><button class="btn sec" data-act="resumo">Copiar resumo</button><button class="btn dang" data-act="fechar">'+(armed.fechar?'Toque de novo para fechar':'Fechar o dia')+'</button></div>'+
       '<div class="actions"><button class="btn" data-act="xlsx">📊 Exportar planilha</button></div>'+
       '<div class="actions"><button class="btn sec" data-act="exp">⬇ Exportar backup</button><button class="btn sec" data-act="imp">⬆ Importar backup</button></div>';
  }else if(view==='clientes'){
    h+='<input class="search" id="qc" type="search" placeholder="Buscar cliente, empresa, CNPJ ou conta" value="'+esc(qc)+'"><div id="list"></div>';
  }else if(view==='listas'){h+=renderGrupos()}
  else if(view==='resumo'){h+=renderResumo()}
  else{h+=renderHist()}
  h+='</main>'+NAV;
  $('#root').innerHTML=h;syncState();
  var fab=$('#fab');fab.style.display=(view==='inicio'||view==='demandas'||view==='clientes'||view==='listas')?'':'none';fab.textContent=view==='clientes'?'+ Novo cliente':view==='listas'?(gAberto?'+ Pessoa':'+ Nova lista'):'+ Nova demanda';
  if(view==='listas'&&gAberto&&$('#plist')){renderPessoas();$('#qp').oninput=function(e){qp=e.target.value;renderPessoas()}}
  if(view==='demandas'){renderList();$('#q').oninput=function(e){q=e.target.value;renderList()};
    $('#ftipo').onchange=function(e){ftipo=e.target.value;renderList()};$('#fcart').onchange=function(e){fcart=e.target.value;renderList()}}
  if(view==='inicio'){var qie=$('#qi');qie.oninput=function(e){qi=e.target.value;buscaGlobal()};if(qi)buscaGlobal()}
  if(view==='clientes'){renderClients();$('#qc').oninput=function(e){qc=e.target.value;renderClients()}}
}
function carteiras(){var s={};CARTEIRAS.forEach(function(c){s[c]=1});state.clients.forEach(function(c){if(c.carteira)s[c.carteira]=1});return Object.keys(s)}
function matchItem(i){if(ftipo&&i.tipo!==ftipo)return false;var c=getC(i.cid)||{};if(fcart&&c.carteira!==fcart)return false;
  if(filtro==='atrasadas'&&!isLate(i))return false;if(filtro==='hoje'&&(i.done||i.due!==today()))return false;if(filtro==='semret'&&!semRet(i))return false;
  if(filtro==='pendentes'&&i.done)return false;if(filtro==='feitas'&&!i.done)return false;
  if(q){var nq=norm(q),dq=digits(q);var hay=norm([c.nome,c.empresa,c.razao,i.what,i.tipo].join(' '));
    if(hay.indexOf(nq)<0&&!(dq.length>=3&&(digits(c.cnpj).indexOf(dq)>=0||digits(c.conta).indexOf(dq)>=0)))return false}
  return true}
function sortItems(a,b){if(a.done!==b.done)return a.done?1:-1;if((a.prio==='alta')!==(b.prio==='alta'))return a.prio==='alta'?-1:1;

  var nm=e.nome||e.razao||'Empresa '+cFmt(e.cnpj),c=blankClient(nm);c.empresa=nm;c.cnpj=cClean(e.cnpj);c.razao=String(e.razao||nm).toUpperCase();c.fantasia=dados.nome&&dados.nome!==dados.razao?String(dados.nome).toUpperCase():'';
  c.situacao=dados._sit||'';c.cidade=dados._cid||'';if(e.convenio)c.convenio=e.convenio;var ac=String(e.agcc||'').split('/');if(ac[1]&&digits(ac[1]))c.conta=ac[1].trim();
  c.obs='Cadastrado automaticamente pela importação da listagem de funcionários.'+(dados._socios&&dados._socios.length?'\nSócios: '+dados._socios.join(', '):'');
  c.createdBy=me();c.updatedBy=me();state.clients.push(c);return c}
function impDup(g,doc){return (g.pessoas||[]).some(function(p){return digits(p.doc)===doc&&doc})}
function impHtml(imp,g,ctx){var h='',E=g.kind==='folha';

    imp.emps.forEach(function(e,i){var nm=(typeof e.existe==='string'&&e.existe)||e.dados&&(e.dados.nome||e.dados.razao)||e.nome||'(buscando nome…)';
      h+='<div class="rf" style="margin-bottom:6px;background:var(--card)"><div><b>'+esc(nm)+'</b></div><div class="hint" style="margin:0">CNPJ '+esc(cFmt(e.cnpj))+(e.ok?'':' · ⚠ dígito não confere, confira')+'</div>'+
        (ctx==='sheet'?(e.existe?'<div class="hint" style="margin:2px 0 0">✓ Já cadastrada nesta folha como '+esc(e.existe)+'</div>':'<label style="display:flex;gap:8px;align-items:center;margin-top:6px;font-size:13px"><input type="checkbox" id="im-e-'+i+'"'+(e.add!==false?' checked':'')+'> Adicionar ao cadastro de empresas da folha</label>'):
          '<div class="hint" style="margin:2px 0 0">'+(e.existe?'✓ Já estava cadastrada acima':'Preenchida em "Empresas e convênios" acima')+'</div>')+'</div>'})}
  var nUp=E&&ctx==='sheet'?P0(imp,g).length:0;
  var P=imp.pessoas,on=P.filter(function(p){return p.on}).length,bad=P.filter(function(p){return !p.ok}).length;
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0 4px"><b style="font-size:14px">👥 '+P.length+' pessoa'+(P.length!==1?'s':'')+' · '+on+' marcada'+(on!==1?'s':'')+'</b>'+(P.length?'<button class="btn sec sm" data-act="imall">'+(on===P.length?'Desmarcar':'Marcar')+' todas</button>':'')+'</div>'+
    (nUp?'<label style="display:flex;gap:8px;align-items:center;margin:4px 0 8px;font-size:13px"><input type="checkbox" id="im-upd"'+(imp.upd!==false?' checked':'')+'> Atualizar a situação da conta de '+nUp+' pessoa(s) que já estão na lista, conforme a imagem</label>':'')+
    (imp.raw?'<button class="btn sec sm" data-act="imraw" style="margin:0 0 8px">📋 Copiar o texto que o app leu</button>':'')+
    '<div class="hint" style="margin:0 0 6px">Confira nomes e CPFs antes de salvar: a leitura pode trocar letras e números.'+(bad?' <b style="color:#dc2626">'+bad+' CPF(s) com dígito inválido</b> em vermelho.':'')+'</div>';
  P.forEach(function(p,i){var dup=impDup(g,p.doc);
    h+='<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px"><input type="checkbox" id="im-on-'+i+'"'+(p.on?' checked':'')+' style="width:20px;height:20px;flex:none">'+
      '<input id="im-n-'+i+'" value="'+esc(p.nome)+'" placeholder="Digite o nome" style="flex:1.6;min-width:0;padding:9px;border:1px solid '+(p.nome?'var(--line)':'#dc2626')+';border-radius:10px;font-size:15px;background:var(--inp)">'+
      '<input id="im-d-'+i+'" value="'+esc(docFmt(p.doc))+'" inputmode="numeric" style="flex:1;min-width:0;padding:9px;border:1px solid '+(cpfValid(p.doc)?'var(--line)':'#dc2626;color:#dc2626')+';border-radius:10px;font-size:15px;background:var(--inp)"></div>'+
      (g.kind==='folha'&&p.info?'<div class="hint" style="margin:-3px 0 6px 26px">➜ '+esc(prov(impPes(g,p)))+(p.info.cc?' · conta '+esc(p.info.cc)+(agInfo(p.info.cc)&&!agInfo(p.info.cc).nao?' (Ag. '+esc(agInfo(p.info.cc).nome+(agInfo(p.info.cc).enc?', '+agInfo(p.info.cc).enc:''))+')':''):'')+'</div>':'')+
      ((dup||p.resp||!p.nome)?'<div class="hint" style="margin:-4px 0 6px 26px">'+[dup?'Já está nesta lista':'',p.resp?'Parece ser o responsável/sócio, não funcionário':'',!p.nome?'<b style="color:#dc2626">Nome não encontrado</b>: digite agora ou edite depois na folha':''].filter(Boolean).join(' · ')+'</div>':'')});

/* trava: pessoa marcada sem nome não pode ser ignorada */
function impSemNome(imp){var f=imp.pessoas.map(function(p,i){return p.on&&!p.nome?i:-1}).filter(function(i){return i>=0});if(!f.length)return false;
  f.forEach(function(i){var e=document.getElementById('im-n-'+i);if(e)e.style.borderColor='#dc2626'});var e=document.getElementById('im-n-'+f[0]);if(e){e.scrollIntoView({block:'center'});setTimeout(function(){e.focus()},300)}
  toast(f.length+(f.length>1?' pessoas marcadas estão':' pessoa marcada está')+' sem nome: digite o nome ou desmarque');return true}
function P0(imp,g){return imp.pessoas.filter(function(p){return p.info&&impDup(g,p.doc)})}
function impRead(imp){var u=document.getElementById('im-upd');if(u)imp.upd=u.checked;imp.pessoas.forEach(function(p,i){var a=document.getElementById('im-on-'+i);if(!a)return;p.on=a.checked;p.nome=document.getElementById('im-n-'+i).value.trim();var d=digits(document.getElementById('im-d-'+i).value);if(d!==p.doc){p.doc=d;p.ok=cpfValid(d)}});
  imp.emps.forEach(function(e,i){var a=document.getElementById('im-e-'+i);if(a)e.add=a.checked})}
function impPrep(imp,g){imp.pessoas.forEach(function(p){if(impDup(g,p.doc))p.on=false})}
function impAdd(g,imp){var n=0,ja={};(g.pessoas||[]).forEach(function(p){var d=digits(p.doc);if(d)ja[d]=1});
  imp.pessoas.forEach(function(p){if(!p.on||(p.doc&&ja[p.doc]))return;var x=impPes(g,p);if(!p.nome){x.nome='⚠ Nome não lido';x.semNome=true}if(g.kind==='folha')x.netto=/Netto/.test(prov(x));
    if(g.kind==='folha'){var e=(g.empresas||[]).filter(function(e){return p.emp&&cClean(e.cnpj)===p.emp})[0];if(e)x.empresa=e.nome||e.razao;else if((g.empresas||[]).length===1)x.empresa=g.empresas[0].nome||g.empresas[0].razao||''}
    x.obs='Importado de imagem em '+br(today());if(p.doc)ja[p.doc]=1;g.pessoas.push(x);n++});return n}

function gOcr(){readGrupo();var E=ed;ocrPick(function(r){if(ed!==E)return;readGrupo();var d=ed.d;impPrep(r,d);ed.imp=r;
  if(d.kind==='folha')r.emps.filter(function(e){return e.ok}).forEach(function(x){var e=d.empresas.filter(function(e){return cClean(e.cnpj)===x.cnpj})[0];
    if(e){x.existe=e.nome||e.razao||1;return}
    e=d.empresas.filter(function(e){return !e.nome&&!e.razao&&!e.cnpj&&!e.convenio})[0];if(!e){e=blankEmp();d.empresas.push(e)}e.cnpj=x.cnpj;
    setTimeout(function(){empBusca(x.cnpj,function(p,ok){if(ed!==E)return;readGrupo();var dd=ed.d,ee=dd.empresas.filter(function(z){return cClean(z.cnpj)===x.cnpj})[0];if(!ee)return;
      if(!ok&&x.nome)p={nome:title(x.nome),razao:title(x.nome)};x.dados=p;empAplica(ee,p);if(p.cid){if(!dd.cid||dd.cid==='@novo')dd.cid=p.cid}else if(!dd.cid&&!state.clients.some(function(c){return cClean(c.cnpj)===x.cnpj})){dd.cid='@novo';ed.novoCli={cnpj:x.cnpj,dados:p}}
      if(!dd.nome&&(ee.nome||ee.razao))dd.nome='Folha '+(ee.nome||ee.razao);drawGrupo();if(ok)toast('Dados da empresa preenchidos')})},0)});

/* 2) dentro de uma folha/listagem já criada */
function pOcr(g){ocrPick(function(r){impPrep(r,g);
  if(g.kind==='folha')r.emps.forEach(function(x){var e=(g.empresas||[]).filter(function(e){return cClean(e.cnpj)===x.cnpj})[0];if(e){x.existe=e.nome||e.razao;return}
    if(!x.ok){x.add=false;return}
    empBusca(x.cnpj,function(p,ok){if(!ok&&x.nome)p={nome:title(x.nome),razao:title(x.nome)};x.dados=p;if(ed&&ed.kind==='imp'&&ed.imp===r){impRead(r);drawImp()}})});
  ed={kind:'imp',g:g,imp:r};drawImp()})}
function drawImp(){var g=ed.g;showSheet('<h3>📷 Importar da imagem</h3>'+impHtml(ed.imp,g,'sheet')+'<div class="sbtns"><button class="btn sec" data-act="cancel">Cancelar</button><button class="btn" data-act="impok">Adicionar</button></div>')}
function impOk(){var g=ed.g,imp=ed.imp;impRead(imp);

    var e=blankEmp();e.cnpj=x.cnpj;empAplica(e,x.dados||{});if(!e.nome)e.nome=x.nome?title(x.nome):'';if(!e.razao)e.razao=e.nome;
    var vazia=g.empresas.filter(function(z){return !z.nome&&!z.razao&&!z.cnpj})[0];if(vazia)Object.assign(vazia,e);else g.empresas.push(e);x.existe=e.nome;
    if(!g.cid){var c=cliDeEmp(e,x.dados);g.cid=c.id}})}
  var n=impAdd(g,imp),u=0;
  if(g.kind==='folha'&&imp.upd!==false)P0(imp,g).forEach(function(p){var x=g.pessoas.filter(function(q){return digits(q.doc)===p.doc})[0];if(!x||okEtapa(x.status))return;
    var y=impPes(g,p);['conta','usa','appNegou','apont'].forEach(function(k){x[k]=y[k]});if(p.info.cc&&!x.cc)x.cc=p.info.cc;x.provManual='';x.netto=/Netto/.test(prov(x));x.at=Date.now();u++});
  var sn=imp.pessoas.filter(function(p){return p.on&&!p.nome}).length;closeSheet();commit([n?n+' pessoa(s) adicionada(s)':'',u?u+' atualizada(s)':'',sn?sn+' sem nome: edite na folha':''].filter(Boolean).join(' · ')||'Nada alterado')}

/* ----- visita à empresa para abrir contas (com ou sem Bradesco Expresso) ----- */
function precisaEnd(p){return p.conta==='nao'&&(restr(p)||!!p.appNegou)}
function visAg(p){return restr(p)||!!p.appNegou}
function visElegiveis(g,exp){return g.pessoas.filter(function(p){return p.conta==='nao'&&!okEtapa(p.status)&&(exp||!visAg(p))}).sort(function(a,b){return norm(a.nome)<norm(b.nome)?-1:1})}
function visAtiva(g){return g.visita&&g.visita.data&&g.visita.data>=today()?g.visita:null}
function openVisita(g){var v=g.visita&&g.visita.data>=today()?JSON.parse(JSON.stringify(g.visita)):{data:'',hora:'',expresso:false,ids:visElegiveis(g,false).map(function(p){return p.id})};

function readVisita(){var v=ed.v;v.data=$('#v-data').value;v.hora=$('#v-hora').value;v.expresso=$('#v-exp').checked;
  v.ids=visElegiveis(ed.g,v.expresso).filter(function(p){var e=document.getElementById('v-p-'+p.id);return e&&e.checked}).map(function(p){return p.id})}

  :['Celular com o aplicativo Bradesco já baixado','Documento de identidade com foto (RG ou CNH) para preencher os dados','Saber o endereço completo com CEP (não precisa levar comprovante)']}
function drawVisita(){var g=ed.g,v=ed.v,E=visElegiveis(g,v.expresso),fora=g.pessoas.filter(function(p){return p.conta!=='nao'&&!okEtapa(p.status)}).length,agF=v.expresso?0:g.pessoas.filter(function(p){return p.conta==='nao'&&!okEtapa(p.status)&&visAg(p)}).length;

   '<div class="row2" style="margin-top:10px"><div class="fld"><label>Data</label><input type="date" id="v-data" value="'+esc(v.data)+'"></div><div class="fld"><label>Hora</label><input type="time" id="v-hora" value="'+esc(v.hora)+'"></div></div>'+

   '<div class="rf" style="margin:8px 0;background:var(--card)"><b style="font-size:13px">Cada funcionário precisa ter:</b>'+visReq(v.expresso).map(function(r){return '<div class="hint" style="margin:2px 0">• '+esc(r)+'</div>'}).join('')+'</div>'+
   '<h4>Funcionários ('+v.ids.length+' de '+E.length+')</h4>';

function semAcento(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[çÇ]/g,function(c){return c==='ç'?'c':'C'})}
function limpaTxt(s){return semAcento(s).toUpperCase().replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}

function agSync(){if(!AGS||!navigator.onLine)return;var u=agUpd(),now=new Date(),mes=now.getFullYear()*100+now.getMonth()+1;if(u.mes>=mes)return;
  var url="https://olinda.bcb.gov.br/olinda/servico/Informes_Agencias/versao/v1/odata/Agencias?$top=10000&$format=json&$filter=CnpjBase%20eq%20'60746948'&$select=CodigoCompe,NomeAgencia,Endereco,Numero,Bairro,Municipio,UF,Posicao";

    Object.keys(AGS).forEach(function(k){var a=AGS[k];if(!a[5]&&!vivo[k]){a=a.slice();a[5]=u.mes;a[6]=pm;a[7]=1;AGS[k]=a;u.ch[k]=a;f++}});

var MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function agInfo(cc){var m=String(cc||'').match(/^\s*(\d{1,4})/);if(!m||!AGS)return null;var cod=+m[1],a=AGS[cod];if(!a)return {cod:cod,nao:true,txt:'Ag '+cod+': não consta na base do Banco Central'};
  var n=a[0].replace(/\s*-\s*URB\.?.*$/i,'').replace(/,\s*URB\.?.*$/i,'').replace(/,\s*[A-Z]{2}$/,'').replace(/\s+URB\s+.*$/i,'').trim(),dig=/DIGITAL/i.test(a[0]),nx=/^NEXT/i.test(a[0]);

  if(man){var mm=man.mes?MESES[+man.mes.slice(5,7)-1]+'/'+man.mes.slice(0,4):'',di=man.dest?AGS[+man.dest]:null,dn=man.dest?'Ag '+man.dest+(di?' – '+title(String(di[0]).replace(/,\s*URB.*$/i,'').replace(/,\s*[A-Z]{2}$/,'')):''):'';
